services:
  db:
    image: postgres:16
    container_name: kompanion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: kompanion
      POSTGRES_PASSWORD: kompanion_secret_2026
      POSTGRES_DB: kompanion
    ports:
      - "5432:5432"
    volumes:
      - kompanion_pgdata:/var/lib/postgresql/data

volumes:
  kompanion_pgdata:
